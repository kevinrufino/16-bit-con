<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mole coffee — animation test</title><style>body{margin:0;background:#fffaeb;color:#263426;font:16px system-ui;padding:40px}main{max-width:920px;margin:auto}h1{font:32px Georgia}p{max-width:650px;line-height:1.6}section{display:flex;align-items:end;gap:32px;flex-wrap:wrap;margin-top:32px}figure{margin:0}canvas{image-rendering:pixelated;display:block;border:1px solid #c0b69f}figcaption{margin-top:12px;font-size:13px}button{padding:10px 20px;background:#ffd11b;border:1px solid #263426;cursor:pointer;margin-top:24px}</style><main><p>16-BIT CON / 9 AM / DOORS OPEN</p><h1>A quiet coffee before the day begins.</h1><p>First style and motion test: a blue-goggled mole in a warm bakery. View the enlarged artwork alongside its actual calendar scale.</p><section><figure><canvas width="128" height="128" style="width:384px;height:384px"></canvas><figcaption>3× pixel preview</figcaption></figure><figure><canvas width="128" height="128" style="width:96px;height:96px"></canvas><figcaption>Desktop tile · 96px</figcaption></figure><figure><canvas width="128" height="128" style="width:48px;height:48px"></canvas><figcaption>Mobile tile · 48px</figcaption></figure></section><button>Pause</button><p id="status"></p></main><script>const canvases=[...document.querySelectorAll('canvas')],button=document.querySelector('button');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,frame=0;button.textContent=paused?'Play':'Pause';Promise.all(Array.from({length:8},(_,i)=>new Promise((resolve,reject)=>{let image=new Image;image.onload=()=>resolve(image);image.onerror=reject;image.src=`frame-${String(i).padStart(2,'0')}.png`}))).then(images=>{function draw(){canvases.forEach(c=>{let x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,128,128);x.drawImage(images[frame],0,0,128,128)})}draw();setInterval(()=>{if(!paused&&!document.hidden){frame=(frame+1)%images.length;draw()}},180);button.onclick=()=>{paused=!paused;button.textContent=paused?'Play':'Pause'};document.querySelector('#status').textContent='8 frames · 128 × 128 · 1.44-second loop'}).catch(()=>document.querySelector('#status').textContent='Animation frames are not ready yet.');</script></html>
